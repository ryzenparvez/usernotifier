<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#076653" />
  <title>JSN WiFi</title>
  <style>

:root{
  --bg:#FFFFFF; --side:#F3FAEA; --main:#FFFFFF; --card:#FFFFFF; --text:#0C342C; --muted:#5F7F73; --line:#E1EDD6; --input:#EFF6E8;
  --purple:#076653; --purple-d:#0C342C; --soft:#E2FBCE; --on:#FFFFFF; --ink:#06231D; --orange:#C5D61A; --yellow:#9DB81C;
  --c-iig:#076653; --c-baishan:#D4E321; --c-cdn:#3E9A52; --c-fna:#0C342C; --c-ggc:#A5DC7B; --c-bdix:#1FA38A;
  --hint-bg:#FFFDDE; --hint-tx:#5E5A06;
  --shadow:0 6px 24px rgba(7,102,83,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14142a; --side:#181833; --main:#1b1b3a; --card:#222247; --text:#f0f0ff; --muted:#9a9cc4; --line:#2e2e5a; --input:#2c2c58;
    --purple:#E3EF26; --purple-d:#C9D81C; --soft:#2c2c58; --on:#06231D; --orange:#8FD16B; --yellow:#E3EF26;
    --c-iig:#3FD1A5; --c-baishan:#E3EF26; --c-cdn:#7CCB5A; --c-fna:#B9F08A; --c-ggc:#1FA38A; --c-bdix:#E2FBCE;
    --hint-bg:rgba(227,239,38,.12); --hint-tx:#E3EF26;
    --shadow:0 6px 24px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14142a; --side:#181833; --main:#1b1b3a; --card:#222247; --text:#f0f0ff; --muted:#9a9cc4; --line:#2e2e5a; --input:#2c2c58;
  --purple:#E3EF26; --purple-d:#C9D81C; --soft:#2c2c58; --on:#06231D; --orange:#8FD16B; --yellow:#E3EF26;
  --c-iig:#3FD1A5; --c-baishan:#E3EF26; --c-cdn:#7CCB5A; --c-fna:#B9F08A; --c-ggc:#1FA38A; --c-bdix:#E2FBCE;
  --hint-bg:rgba(227,239,38,.12); --hint-tx:#E3EF26;
  --shadow:0 6px 24px rgba(0,0,0,.3); color-scheme:dark;
}
:root{--warn:#9A6700;--bad:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#F5C542;--bad:#FF8A80}}

        * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 12%, color-mix(in srgb, var(--purple), transparent 88%), transparent 30%),
        var(--side);
      color: var(--text);
      font-family: Inter, "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, sans-serif;
    }

    /* ============ Desktop / Tablet ============ */
    .modal {
      width: min(100%, 480px);
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      animation: appear .45s ease both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(16px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .top {
      padding: 26px 28px 22px;
      text-align: center;
      background: linear-gradient(135deg, var(--soft), var(--card));
      border-bottom: 1px solid var(--line);
    }
    .logo { display: block; height: 46px; border-radius: 8px; width: auto; max-width: 80%; margin: 0 auto 18px; }
    .bk { width: 18px; height: 18px; border-radius: 5px; vertical-align: -4px; margin-right: 5px; }
    .status-icon {
      width: 76px; height: 76px; margin: 0 auto 15px;
      display: grid; place-items: center; border-radius: 24px;
      color: var(--purple); background: var(--soft); border: 1px solid var(--line);
    }
    .status-icon svg { width: 38px; height: 38px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.45; font-weight: 850; color: var(--text); }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .content { padding: 22px 26px 24px; }
    .notice {
      padding: 13px 14px; display: flex; gap: 10px; align-items: flex-start;
      color: var(--text); background: var(--input); border: 1px solid var(--line);
      border-radius: 13px; font-size: 13px; line-height: 1.65;
    }
    .notice svg { flex: 0 0 18px; margin-top: 2px; }
    .section-title { margin: 20px 0 10px; color: var(--text); font-size: 13px; font-weight: 800; }

    .payment-card { padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); }
    .payment-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .payment-row + .payment-row { margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line); }
    .pay-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .pay-brand { color: #d62975; font-weight: 850; letter-spacing: .03em; }
    .pay-number { font-size: 18px; font-weight: 800; letter-spacing: .04em; color: var(--text); }
    .copy {
      flex: none; border: 0; border-radius: 10px; padding: 9px 14px;
      background: var(--soft); color: var(--purple);
      font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
      transition: background .15s;
    }
    .copy:hover { background: var(--line); }
    .copy.done { background: var(--purple); color: var(--on); }

    .footer {
      padding: 15px 22px 17px; text-align: center;
      border-top: 1px solid var(--line); background: var(--side);
    }
    .office { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .office b { color: var(--text); }
    .call {
      margin-top: 9px; display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px; border-radius: 999px;
      background: var(--purple); color: var(--on); text-decoration: none;
      font-size: 13px; font-weight: 800;
    }
    .call:hover { background: var(--purple-d); }
    .call svg { width: 15px; height: 15px; }

    /* ============ Mobile: 1:1 square popup ============ */
    @media (max-width: 640px) {
      body { padding: 0; }
      .modal {
        width: min(94vw, 94vh);
        aspect-ratio: 1 / 1;
        container-type: size;
        display: flex; flex-direction: column;
        border-radius: 6cqw;
      }
      /* everything below scales with the square (100cqw = popup side) */
      .modal { border-radius: 24px; }
      .top { padding: 4.5cqw 5cqw 3cqw; flex: none; }
      .logo { height: 9.5cqw; margin-bottom: 2.5cqw; }
      .bk { width: 4.2cqw; height: 4.2cqw; border-radius: 1.2cqw; vertical-align: -.9cqw; margin-right: 1.2cqw; }
      .status-icon, .notice { display: none; }
      h1 { font-size: 5.6cqw; line-height: 1.35; }
      .subtitle { margin-top: .8cqw; font-size: 3.3cqw; line-height: 1.4; }

      .content { flex: 1; min-height: 0; padding: 3cqw 4.5cqw 2.5cqw; display: flex; flex-direction: column; justify-content: center; }
      .section-title { margin: 0 0 1.5cqw; font-size: 3.2cqw; }
      .payment-card { padding: 3.4cqw 3.6cqw; border-radius: 3.4cqw; }
      .payment-row { gap: 2cqw; }
      .payment-row + .payment-row { margin-top: 3cqw; padding-top: 3cqw; }
      .pay-label { margin-bottom: .6cqw; font-size: 2.9cqw; }
      .pay-number { font-size: 5.6cqw; letter-spacing: .03em; }
      .copy { padding: 2.2cqw 3.4cqw; border-radius: 2.4cqw; font-size: 3cqw; }

      .footer { flex: none; padding: 2.2cqw 4cqw 2.6cqw; }
      .office { font-size: 3cqw; line-height: 1.45; }
      .call { margin-top: 1.6cqw; padding: 1.9cqw 4.4cqw; font-size: 3.4cqw; gap: 1.6cqw; }
      .call svg { width: 3.4cqw; height: 3.4cqw; }
    }

    @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
  
    .badge{margin:12px 0 0;padding:10px;border-radius:13px;text-align:center;font-weight:800;font-size:14px;background:color-mix(in srgb,var(--warn),transparent 84%);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn),transparent 65%)}
    .badge.red{background:color-mix(in srgb,var(--bad),transparent 86%);color:var(--bad);border-color:color-mix(in srgb,var(--bad),transparent 65%)}
    .ack{margin-top:14px;width:100%;border:0;border-radius:999px;padding:13px;background:var(--purple);color:var(--on);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
    @media (max-width: 640px) {
      .content{overflow:auto}
      .badge{display:none}
      .ack{margin-top:2.4cqw;padding:2.2cqw;font-size:3.3cqw}
      .bk{vertical-align:-.9cqw}
      .hasack .top{padding:3.4cqw 5cqw 2cqw}
      .hasack .logo{height:8.2cqw;margin-bottom:1.6cqw}
      .hasack .content{justify-content:flex-start;padding-top:2.6cqw}
      .hasack .section-title{display:none}
      .hasack .payment-card{padding:2.2cqw 3cqw}
      .hasack .pay-label{font-size:2.6cqw;margin-bottom:0}
      .hasack .pay-number{font-size:4.6cqw}
      .hasack .payment-row+.payment-row{margin-top:1.6cqw;padding-top:1.6cqw}
      .hasack .copy{padding:1.5cqw 3cqw}
      .hasack .footer{padding:1.8cqw 4cqw 2cqw}
    }
  </style>
</head>
<body>
  <main class="modal {{CLS}}" role="dialog" aria-labelledby="popup-title" aria-describedby="popup-description">
    <header class="top">
      <img class="logo" alt="" src="{{LOGO}}" />
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5a14.5 14.5 0 0 1 18 0M6.2 11.8a9.5 9.5 0 0 1 11.6 0M9.5 15.2a4.5 4.5 0 0 1 5 0"/>
          <path d="M4 4l16 16"/><path d="M12 18.5v.1"/>
        </svg>
      </div>
      <h1 id="popup-title">{{TITLE}}</h1>
      <p class="subtitle" id="popup-description">{{SUBTITLE}}</p>
    </header>

    <section class="content">
      <div class="notice">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5m0 4h.01"/>
        </svg>
        <span>{{NOTICE}}</span>
      </div>
      {{BADGE}}
      <div>
        <h2 class="section-title">পেমেন্ট নম্বর</h2>
        <div class="payment-card">
{{PAYMENTS}}
        </div>
      </div>
      {{ACK}}
    </section>

    <footer class="footer">
{{FOOTER}}
    </footer>
  </main>

  <script>
    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    }
    document.querySelectorAll("[data-copy]").forEach((button) => {
      const original = button.textContent;
      button.addEventListener("click", async () => {
        const number = button.dataset.copy;
        let ok = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(number);
            ok = true;
          }
        } catch (e) {}
        if (!ok) ok = fallbackCopy(number);
        button.textContent = ok ? "কপি হয়েছে ✓" : number;
        button.classList.toggle("done", ok);
        setTimeout(() => { button.textContent = original; button.classList.remove("done"); }, 1600);
      });
    });
  </script>
</body>
</html>
