[billing]
; কতদিন আগে থেকে সতর্কতা পপ-আপ যাবে
warn_days_before = 3
; পেমেন্ট CSV (প্রতি মাসের ফাইল এই ফোল্ডারে রাখুন)
csv_glob = data/*.csv

[router]
host = 192.168.88.1
port = 8728
user = notifier
password = CHANGE_ME
sync_seconds = 60

[portal]
port = 8080
; "বুঝেছি" চাপলে এত সময় পপ-আপ আর আসবে না
seen_timeout = 3h

[admin]
; শুধু প্রথমবার (auth.json না থাকলে) এই ইউজার/পাসওয়ার্ড দিয়ে লগইন তৈরি হয়; এরপর সেটিং > লগইন ও পাসওয়ার্ড থেকে বদলান
user = admin
password = CHANGE_ME_ADMIN
; যে হোস্টনামে /admin খোলা যাবে (localhost ও প্রাইভেট IP সবসময় চলে; ডোমেইন সেটিং থেকে যোগ হয়)
hosts = localhost,127.0.0.1
